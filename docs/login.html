<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your My Mess account.">
    <title>Sign In — My Mess</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="My Mess" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="auth-page">
  <div class="auth-stack">
    <section class="auth-card" aria-labelledby="authTitle">
        <header class="auth-card-header">
            <div class="auth-logo" aria-hidden="true">
                <img src="favicon-96x96.png" width="30" height="30" alt="" style="border-radius: 6px;">
            </div>
            <h1 id="authTitle">My Mess</h1>
            <p>Sign in to manage your mess account</p>
        </header>

        <div class="auth-card-body">
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div style="position: relative;">
                    <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" style="width: 100%; padding-right: 40px; box-sizing: border-box;">
                    <button type="button" onclick="togglePassword()" aria-label="Show or hide password" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 4px; display: flex; align-items: center; color: #666;">
                        <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button class="btn btn-primary" onclick="login()">Sign In</button>

            <div id="loginMsg" aria-live="polite"></div>

            <footer>
                <p class="auth-footer">
                    <a href="forgot-password.html">Forgot password?</a>
                </p>

                <p class="auth-footer">
                    Don't have an account? <a href="register.html">Create one</a>
                </p>
            </footer>
        </div>
    </section>

  </div>
</main>

<script>
const API = "https://my-mess-q25u.onrender.com";

function togglePassword() {
    const input = document.getElementById("password");
    const icon = document.getElementById("eyeIcon");
    const isHidden = input.type === "password";
    input.type = isHidden ? "text" : "password";
    icon.innerHTML = isHidden
        ? '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
}

function login() {
    const data = {
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
    };

    const msgEl = document.getElementById("loginMsg");
    msgEl.className = "";
    msgEl.innerText = "";

    fetch(`${API}/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
    })
      .then(async (res) => {
    const text = await res.text();

    let payload;
    try {
        payload = JSON.parse(text);
    } catch {
        payload = { message: text };
    }

    if (res.ok) {
        localStorage.setItem("loggedIn", "true");
        localStorage.setItem("role", String(payload.role).toLowerCase().trim());
        localStorage.setItem("customer_id", payload.customer_id);
        localStorage.setItem("name", payload.name || "");
        localStorage.setItem("contact", payload.contact || "");
        localStorage.setItem("email", payload.email || "");
        window.location.href = "home.html";
        return;
    }

    msgEl.className = "alert alert-error";
    msgEl.innerText = payload.message || "Invalid email or password";
   })
   .catch(err => {
    console.error(err);
    msgEl.className = "alert alert-error";
    msgEl.innerText = "Unable to reach server. Is the backend running?";
  });
    }

</script>

</body>
</html>
